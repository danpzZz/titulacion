@if (isLoading()) {
  <div class="custom-form-card" style="text-align:center">
    <i class="pi pi-spin pi-spinner" style="font-size:2rem"></i>
  </div>
} @else {

  <!-- Header con título y botones -->
  <div class="custom-form-card">
    <div class="custom-form-grid md:grid-cols-12">

      <div class="custom-form-field md:col-span-6">
        <div style="display:flex;align-items:center;gap:0.5rem">
          <i class="pi pi-pencil" style="color:var(--primary-color)"></i>
          <span style="font-size:1.25rem;font-weight:600;color:var(--primary-color)">
            {{ id() === 'new' ? 'Nueva Matrícula' : 'Editar Matrícula' }}
          </span>
        </div>
        <small style="color:var(--text-color-secondary)">
          Todos los campos con * son obligatorios.
        </small>
      </div>

      <div class="custom-form-field-row md:col-span-6" style="justify-content:flex-end">
        <p-button
          (click)="back()"
          [icon]="IconButtonActionEnum.CANCEL"
          [label]="LabelButtonActionEnum.CANCEL"
          [severity]="SeverityButtonActionEnum.CANCEL">
        </p-button>

        <p-button
          (click)="onSubmit()"
          [icon]="IconButtonActionEnum.SAVE"
          [label]="LabelButtonActionEnum.SAVE"
          [severity]="SeverityButtonActionEnum.SAVE">
        </p-button>
      </div>

    </div>
  </div>

  <!-- Formulario -->
  <div class="custom-form-card">
    <div class="custom-form-grid md:grid-cols-12">

      <!-- Número de documento -->
      <div class="custom-form-field md:col-span-4">
        <label appLabel label="Número de documento"></label>
        <input
          pInputText
          class="w-full"
          [value]="form$().student.user.identification ?? ''"
          readonly
          style="background:var(--surface-hover)" />
      </div>

      <!-- Apellidos -->
      <div class="custom-form-field md:col-span-4">
        <label appLabel label="Apellidos"></label>
        <input
          pInputText
          class="w-full"
          [value]="form$().student.user.lastname ?? ''"
          readonly
          style="background:var(--surface-hover)" />
      </div>

      <!-- Nombres -->
      <div class="custom-form-field md:col-span-4">
        <label appLabel label="Nombres"></label>
        <input
          pInputText
          class="w-full"
          [value]="form$().student.user.name ?? ''"
          readonly
          style="background:var(--surface-hover)" />
      </div>

      <!-- Correo institucional -->
      <div class="custom-form-field md:col-span-3">
        <label appLabel label="Correo institucional"></label>
        <input
          pInputText
          class="w-full"
          [value]="form$().student.user.email ?? ''"
          readonly
          style="background:var(--surface-hover)" />
      </div>

      <!-- Correo personal -->
      <div class="custom-form-field md:col-span-3">
        <label appLabel label="Correo personal"></label>
        <input
          pInputText
          class="w-full"
          [value]="form$().student.user.personalEmail ?? ''"
          readonly
          style="background:var(--surface-hover)" />
      </div>

      <!-- Celular -->
      <div class="custom-form-field md:col-span-3">
        <label appLabel label="Celular"></label>
        <input
          pInputText
          class="w-full"
          [value]="form$().student.user.cellPhone ?? ''"
          readonly
          style="background:var(--surface-hover)" />
      </div>

      <!-- Teléfono fijo -->
      <div class="custom-form-field md:col-span-3">
        <label appLabel label="Teléfono fijo"></label>
        <input
          pInputText
          class="w-full"
          [value]="form$().student.user.phone ?? ''"
          readonly
          style="background:var(--surface-hover)" />
      </div>

      <!-- Fecha de matrícula -->
      <div class="custom-form-field md:col-span-4">
        <label appLabel label="Fecha de matrícula"></label>
        <input
          pInputText
          class="w-full"
          [value]="form$().date ?? ''"
          readonly
          style="background:var(--surface-hover)" />
      </div>

      <!-- Código de matrícula -->
      <div class="custom-form-field md:col-span-4">
        <label appLabel label="Código de matrícula"></label>
        <input
          pInputText
          class="w-full"
          [value]="form$().code ?? ''"
          readonly
          style="background:var(--surface-hover)" />
      </div>

      <!-- Estado -->
      <div class="custom-form-field md:col-span-4">
        <label appLabel label="Estado"></label>

        <div style="height:2.6rem;display:flex;align-items:center">
          @if (form$().enrollmentState) {
            <p-tag
              [value]="form$().enrollmentState!.state.name"
              [severity]="form$().enrollmentState!.state.code | enrollmentState">
            </p-tag>
          } @else {
            <p-tag value="Sin estado" severity="warn"></p-tag>
          }
        </div>
      </div>

      <!-- Tipo -->
      <div class="custom-form-field md:col-span-3">
        <label appLabel label="Tipo" [field]="typeField"></label>
        <p-select
          dataKey="id"
          [formField]="typeField"
          [options]="types()"
          optionLabel="name"
          placeholder="Seleccione"
          styleClass="w-full">
        </p-select>
        <small [appErrorMessage]="$any(typeField)"></small>
      </div>

      <!-- Periodo académico -->
      <div class="custom-form-field md:col-span-3">
        <label appLabel label="Periodo académico" [field]="academicPeriodField"></label>
        <p-select
          dataKey="id"
          [formField]="academicPeriodField"
          [options]="academicPeriods()"
          optionLabel="name"
          placeholder="Seleccione"
          styleClass="w-full">
        </p-select>
        <small [appErrorMessage]="$any(academicPeriodField)"></small>
      </div>

      <!-- Horario -->
      <div class="custom-form-field md:col-span-3">
        <label appLabel label="Horario" [field]="workdayField"></label>
        <p-select
          dataKey="id"
          [formField]="workdayField"
          [options]="workdays()"
          optionLabel="name"
          placeholder="Seleccione"
          styleClass="w-full">
        </p-select>
        <small [appErrorMessage]="$any(workdayField)"></small>
      </div>

      <!-- Paralelo -->
      <div class="custom-form-field md:col-span-3">
        <label appLabel label="Paralelo" [field]="parallelField"></label>
        <p-select
          dataKey="id"
          [formField]="parallelField"
          [options]="parallels()"
          optionLabel="name"
          placeholder="Seleccione"
          styleClass="w-full">
        </p-select>
        <small [appErrorMessage]="$any(parallelField)"></small>
      </div>

      <!-- Observación -->
      <div class="custom-form-field md:col-span-12">
        <label appLabel label="Observación" [field]="observationField"></label>
        <input
          pInputText
          class="w-full"
          [formField]="observationField" />
        <small [appErrorMessage]="$any(observationField)"></small>
      </div>

    </div>
  </div>
}
