<div class="card">
    <div class="flex flex-column md:flex-row md:align-items-center md:justify-content-between gap-3 mb-4">
        <div>
            <h2 class="m-0">Formulario de Matrícula</h2>
            <span class="text-600">Cabecera de matrícula del estudiante</span>
        </div>
        <div class="flex gap-2">
            <p-button label="Asignaturas" icon="pi pi-book" severity="info" (onClick)="goToDetails()" />
            <p-button label="Cancelar" icon="pi pi-times" severity="secondary" [outlined]="true" (onClick)="back()" />
        </div>
    </div>

    @if (loading()) {
        <div class="p-4 border-round surface-100">Cargando matrícula...</div>
    } @else {
        <form (submit)="save($event)">
            <h4>Datos del estudiante</h4>
            <div class="grid">
                <div class="col-12 md:col-4">
                    <label class="block mb-2 font-medium">Número de documento</label>
                    <input pInputText class="w-full" [formField]="enrollmentForm.student.user.identification" />
                </div>
                <div class="col-12 md:col-4">
                    <label class="block mb-2 font-medium">Apellidos</label>
                    <input pInputText class="w-full" [formField]="enrollmentForm.student.user.lastname" />
                </div>
                <div class="col-12 md:col-4">
                    <label class="block mb-2 font-medium">Nombres</label>
                    <input pInputText class="w-full" [formField]="enrollmentForm.student.user.name" />
                </div>
                <div class="col-12 md:col-4">
                    <label class="block mb-2 font-medium">Correo institucional</label>
                    <input pInputText class="w-full" [formField]="enrollmentForm.student.user.email" />
                </div>
                <div class="col-12 md:col-4">
                    <label class="block mb-2 font-medium">Correo personal</label>
                    <input pInputText class="w-full" [formField]="enrollmentForm.student.user.personalEmail" />
                </div>
                <div class="col-12 md:col-2">
                    <label class="block mb-2 font-medium">Celular</label>
                    <input pInputText class="w-full" [formField]="enrollmentForm.student.user.cellPhone" />
                </div>
                <div class="col-12 md:col-2">
                    <label class="block mb-2 font-medium">Teléfono</label>
                    <input pInputText class="w-full" [formField]="enrollmentForm.student.user.phone" />
                </div>
            </div>

            <h4 class="mt-4">Información de matrícula</h4>
            <div class="grid">
                <div class="col-12 md:col-3">
                    <label class="block mb-2 font-medium">Fecha de matrícula</label>
                    <input type="date" class="p-inputtext p-component w-full" [formField]="enrollmentForm.date" />
                </div>
                <div class="col-12 md:col-3">
                    <label class="block mb-2 font-medium">Código de matrícula</label>
                    <input pInputText class="w-full" [formField]="enrollmentForm.code" />
                </div>
                <div class="col-12 md:col-3">
                    <label class="block mb-2 font-medium">Estado de matrícula</label>
                    <input pInputText class="w-full" [formField]="enrollmentForm.enrollmentStateName" />
                </div>
            </div>

            <h4 class="mt-4">Ficha socioeconómica</h4>
            <div class="grid">
                <div class="col-12 md:col-4">
                    <label class="block mb-2 font-medium">Categoría</label>
                    <input pInputText class="w-full" [formField]="enrollmentForm.socioeconomicCategory" />
                </div>
                <div class="col-12 md:col-4">
                    <label class="block mb-2 font-medium">Porcentaje</label>
                    <input pInputText class="w-full" [formField]="enrollmentForm.socioeconomicPercentage" />
                </div>
                <div class="col-12 md:col-4">
                    <label class="block mb-2 font-medium">Puntaje</label>
                    <input pInputText class="w-full" [formField]="enrollmentForm.socioeconomicScore" />
                </div>
            </div>

            <h4 class="mt-4">Observación</h4>
            <div class="grid">
                <div class="col-12">
                    <label class="block mb-2 font-medium">Observación de la matrícula</label>
                    <textarea class="p-inputtext p-component w-full" rows="4" [formField]="enrollmentForm.observation"></textarea>
                    <small [appErrorMessage]="$any(enrollmentForm.observation)"></small>
                </div>
            </div>

            @if (message()) {
                <div class="mt-3 p-3 border-round surface-100">{{ message() }}</div>
            }

            <div class="flex justify-content-end gap-2 mt-4">
                <p-button label="Cancelar" severity="secondary" [outlined]="true" type="button" (onClick)="back()" />
                <p-button label="Guardar" icon="pi pi-save" type="submit" />
            </div>
        </form>
    }
</div>
