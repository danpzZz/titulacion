<div class="card">
    <div class="flex flex-column md:flex-row md:align-items-center md:justify-content-between gap-3 mb-4">
        <div>
            <h2 class="m-0">{{ isEditMode() ? 'Editar Detalle de Matrícula' : 'Crear Detalle de Matrícula' }}</h2>
            <span class="text-600">Asignaturas y datos académicos de la matrícula</span>
        </div>
        <p-button label="Regresar" icon="pi pi-arrow-left" severity="secondary" [outlined]="true" (onClick)="back()" />
    </div>

    @if (loading()) {
        <div class="p-4 border-round surface-100">Cargando detalle...</div>
    } @else {
        <form (submit)="save($event)">
            <h4>Datos académicos</h4>
            <div class="grid">
                <div class="col-12 md:col-4">
                    <label class="block mb-2 font-medium">Periodo académico</label>
                    <select class="p-inputtext p-component w-full" [formField]="detailForm.academicPeriodId">
                        <option value="">Seleccione</option>
                        @for (item of academicPeriods(); track item.id) {
                            <option [value]="item.id">{{ item.name }}</option>
                        }
                    </select>
                    <small [appErrorMessage]="$any(detailForm.academicPeriodId)"></small>
                </div>
                <div class="col-12 md:col-8">
                    <label class="block mb-2 font-medium">Asignatura</label>
                    <select class="p-inputtext p-component w-full" [formField]="detailForm.subjectId">
                        <option value="">Seleccione</option>
                        @for (item of filteredSubjects(); track item.id) {
                            <option [value]="item.id">{{ item.code }} - {{ item.name }} ({{ item.academicPeriod?.name }})</option>
                        }
                    </select>
                    <small [appErrorMessage]="$any(detailForm.subjectId)"></small>
                </div>
                <div class="col-12 md:col-3">
                    <label class="block mb-2 font-medium">Tipo de matrícula</label>
                    <select class="p-inputtext p-component w-full" [formField]="detailForm.typeId">
                        <option value="">Seleccione</option>
                        @for (item of types(); track item.id) { <option [value]="item.id">{{ item.name }}</option> }
                    </select>
                    <small [appErrorMessage]="$any(detailForm.typeId)"></small>
                </div>
                <div class="col-12 md:col-3">
                    <label class="block mb-2 font-medium">Número de matrícula</label>
                    <input type="number" class="p-inputtext p-component w-full" [formField]="detailForm.number" />
                    <small [appErrorMessage]="$any(detailForm.number)"></small>
                </div>
                <div class="col-12 md:col-3">
                    <label class="block mb-2 font-medium">Horario</label>
                    <select class="p-inputtext p-component w-full" [formField]="detailForm.workdayId">
                        <option value="">Seleccione</option>
                        @for (item of workdays(); track item.id) { <option [value]="item.id">{{ item.name }}</option> }
                    </select>
                    <small [appErrorMessage]="$any(detailForm.workdayId)"></small>
                </div>
                <div class="col-12 md:col-3">
                    <label class="block mb-2 font-medium">Paralelo</label>
                    <select class="p-inputtext p-component w-full" [formField]="detailForm.parallelId">
                        <option value="">Seleccione</option>
                        @for (item of parallels(); track item.id) { <option [value]="item.id">{{ item.name }}</option> }
                    </select>
                    <small [appErrorMessage]="$any(detailForm.parallelId)"></small>
                </div>
                <div class="col-12 md:col-3">
                    <label class="block mb-2 font-medium">Fecha de matrícula</label>
                    <input type="date" class="p-inputtext p-component w-full" [formField]="detailForm.date" />
                </div>
            </div>

            <h4 class="mt-4">Resultado académico</h4>
            <div class="grid">
                <div class="col-12 md:col-4">
                    <label class="block mb-2 font-medium">Calificación final</label>
                    <input type="number" class="p-inputtext p-component w-full" [formField]="detailForm.finalGrade" step="0.01" />
                </div>
                <div class="col-12 md:col-4">
                    <label class="block mb-2 font-medium">Asistencia</label>
                    <input type="number" class="p-inputtext p-component w-full" [formField]="detailForm.finalAttendance" step="0.01" />
                </div>
                <div class="col-12 md:col-4">
                    <label class="block mb-2 font-medium">Estado académico</label>
                    <select class="p-inputtext p-component w-full" [formField]="detailForm.academicStateId">
                        <option value="">Seleccione</option>
                        @for (item of academicStates(); track item.id) { <option [value]="item.id">{{ item.name }}</option> }
                    </select>
                </div>
            </div>

            <h4 class="mt-4">Observación</h4>
            <div class="grid">
                <div class="col-12">
                    <label class="block mb-2 font-medium">Observación de la matrícula</label>
                    <textarea class="p-inputtext p-component w-full" rows="4" [formField]="detailForm.observation"></textarea>
                </div>
            </div>

            @if (message()) {
                <div class="mt-3 p-3 border-round surface-100">{{ message() }}</div>
            }

            <div class="flex justify-content-end gap-2 mt-4">
                <p-button label="Cancelar" severity="secondary" [outlined]="true" type="button" (onClick)="back()" />
                <p-button label="Guardar" icon="pi pi-save" type="submit" />
            </div>
        </form>
    }
</div>
