<div class="card">
    <p-breadcrumb
        class="mb-4"
        [model]="[{ label: 'Matrículas', command: back.bind(this) }, { label: 'Detalle de Matrícula', command: back.bind(this) }, { label: 'Formulario' }]"
        [home]="{ icon: 'pi pi-home', routerLink: '/' }"
    />

    <div class="flex align-items-center justify-content-between mb-1">
        <div class="flex align-items-center gap-2">
            <i class="pi pi-pencil text-primary text-xl"></i>
            <h2 class="m-0 text-xl font-semibold">{{ isEditMode() ? 'Editar' : 'Crear' }}</h2>
        </div>
        <div class="flex gap-2">
            <p-button label="Cancelar" icon="pi pi-arrow-left" severity="secondary" type="button" (onClick)="back()" />
            <p-button label="Guardar" icon="pi pi-save" severity="info" type="submit" form="detailForm" />
        </div>
    </div>
    <p class="text-500 mt-0 mb-1 text-sm">Todos los campos con <span class="text-red-500">*</span> son obligatorios.</p>

    <p-divider class="my-3" />

    @if (loading()) {
        <div class="grid">
            @for (i of [1,2,3,4,5,6]; track i) {
                <div class="col-12 md:col-6"><p-skeleton height="2.5rem" styleClass="mb-2" /></div>
            }
        </div>
    } @else {
        <form id="detailForm" (submit)="save($event)">
            <div class="grid">

                <!-- Periodo académico -->
                <div class="col-12 md:col-6">
                    <label class="block mb-1 text-sm font-medium text-700">Periodo académico: <span class="text-red-500">*</span></label>
                    <p-select
                        class="w-full"
                        [options]="academicPeriods()"
                        optionLabel="name"
                        optionValue="id"
                        placeholder="Seleccione"
                        [ngModel]="model().academicPeriodId"
                        (ngModelChange)="model.update(m => ({...m, academicPeriodId: $event}))"
                        name="academicPeriodId"
                    />
                    <small [appErrorMessage]="$any(detailForm.academicPeriodId)"></small>
                </div>

                <!-- Asignatura -->
                <div class="col-12 md:col-6">
                    <label class="block mb-1 text-sm font-medium text-700">Asignatura:</label>
                    <p-select
                        class="w-full"
                        [options]="filteredSubjects()"
                        optionLabel="name"
                        optionValue="id"
                        placeholder="Seleccione"
                        [ngModel]="model().subjectId"
                        (ngModelChange)="model.update(m => ({...m, subjectId: $event}))"
                        name="subjectId"
                    />
                    <small [appErrorMessage]="$any(detailForm.subjectId)"></small>
                </div>

                <!-- Tipo de matrícula -->
                <div class="col-12 md:col-6">
                    <label class="block mb-1 text-sm font-medium text-700">Tipo de matrícula: <span class="text-red-500">*</span></label>
                    <p-select
                        class="w-full"
                        [options]="types()"
                        optionLabel="name"
                        optionValue="id"
                        placeholder="Seleccione"
                        [ngModel]="model().typeId"
                        (ngModelChange)="model.update(m => ({...m, typeId: $event}))"
                        name="typeId"
                    />
                    <small [appErrorMessage]="$any(detailForm.typeId)"></small>
                </div>

                <!-- Horario -->
                <div class="col-12 md:col-6">
                    <label class="block mb-1 text-sm font-medium text-700">Horario: <span class="text-red-500">*</span></label>
                    <p-select
                        class="w-full"
                        [options]="workdays()"
                        optionLabel="name"
                        optionValue="id"
                        placeholder="Seleccione"
                        [ngModel]="model().workdayId"
                        (ngModelChange)="model.update(m => ({...m, workdayId: $event}))"
                        name="workdayId"
                    />
                    <small [appErrorMessage]="$any(detailForm.workdayId)"></small>
                </div>

                <!-- Paralelo -->
                <div class="col-12 md:col-6">
                    <label class="block mb-1 text-sm font-medium text-700">Paralelo: <span class="text-red-500">*</span></label>
                    <p-select
                        class="w-full"
                        [options]="parallels()"
                        optionLabel="name"
                        optionValue="id"
                        placeholder="Seleccione"
                        [ngModel]="model().parallelId"
                        (ngModelChange)="model.update(m => ({...m, parallelId: $event}))"
                        name="parallelId"
                    />
                    <small [appErrorMessage]="$any(detailForm.parallelId)"></small>
                </div>

                <!-- Número de matrícula -->
                <div class="col-12 md:col-3">
                    <label class="block mb-1 text-sm font-medium text-700">Numero de matrícula: <span class="text-red-500">*</span></label>
                    <input type="number" class="p-inputtext p-component w-full" [formField]="detailForm.number" />
                    <small [appErrorMessage]="$any(detailForm.number)"></small>
                </div>

                <!-- Fecha -->
                <div class="col-12 md:col-3">
                    <label class="block mb-1 text-sm font-medium text-700">Fecha de matrícula: <i class="pi pi-question-circle text-400 ml-1" style="font-size:0.8rem"></i></label>
                    <input type="date" class="p-inputtext p-component w-full" [formField]="detailForm.date" />
                </div>
            </div>

            <p-divider class="my-2" />

            <!-- Resultado académico -->
            <div class="grid">
                <div class="col-12 md:col-4">
                    <label class="block mb-1 text-sm font-medium text-700">Calificación Final:</label>
                    <input type="number" class="p-inputtext p-component w-full" [formField]="detailForm.finalGrade" step="0.01" />
                </div>
                <div class="col-12 md:col-4">
                    <label class="block mb-1 text-sm font-medium text-700">Asistencia:</label>
                    <input type="number" class="p-inputtext p-component w-full" [formField]="detailForm.finalAttendance" step="0.01" />
                </div>
                <div class="col-12 md:col-4">
                    <label class="block mb-1 text-sm font-medium text-700">Estado Académico:</label>
                    <p-select
                        class="w-full"
                        [options]="academicStates()"
                        optionLabel="name"
                        optionValue="id"
                        placeholder="Seleccione"
                        [ngModel]="model().academicStateId"
                        (ngModelChange)="model.update(m => ({...m, academicStateId: $event}))"
                        name="academicStateId"
                    />
                </div>
            </div>

            <p-divider class="my-2" />

            <!-- Observación -->
            <div class="grid">
                <div class="col-12">
                    <label class="block mb-1 text-sm font-medium text-700">Observación de la matrícula:</label>
                    <textarea class="p-inputtext p-component w-full" rows="3" [formField]="detailForm.observation"></textarea>
                </div>
            </div>

            @if (message()) {
                <p-divider class="my-2" />
                <div class="p-3 border-round bg-red-50 text-red-700 text-sm">
                    <i class="pi pi-exclamation-triangle mr-2"></i>{{ message() }}
                </div>
            }
        </form>
    }
</div>
